<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rekognition Image Detector - Immagini analizzate</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="config.js"></script>
</head>
<body class="bg-body-tertiary">

<nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">&#128247; Rekognition Image Detector</a>
    <div class="navbar-nav">
      <a class="nav-link" href="index.html">Carica immagine</a>
      <a class="nav-link active" href="lista.html">Immagini analizzate</a>
    </div>
  </div>
</nav>

<div class="container py-4">

  <div class="card shadow-sm">
    <div class="card-header bg-white d-flex flex-wrap gap-3 align-items-center justify-content-between">
      <h5 class="mb-0">Immagini analizzate</h5>
      <div class="d-flex align-items-center gap-3">
        <div class="form-check form-switch mb-0">
          <input class="form-check-input" type="checkbox" role="switch" id="filtro-rilevanti">
          <label class="form-check-label" for="filtro-rilevanti">
            Solo rilevanti (<span id="keyword-label">...</span>)
          </label>
        </div>
        <button class="btn btn-sm btn-outline-primary" id="btn-ricarica">
          <span class="spinner-border spinner-border-sm d-none" id="spinner" role="status"></span>
          Ricarica
        </button>
      </div>
    </div>

    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th style="width: 120px">Anteprima</th>
              <th>File</th>
              <th style="width: 170px">Data analisi</th>
              <th style="width: 130px">Rilevante</th>
              <th>Elementi riconosciuti</th>
            </tr>
          </thead>
          <tbody id="tabella">
            <tr><td colspan="5" class="text-center text-secondary py-4">Caricamento...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card-footer bg-white text-secondary small" id="riepilogo"></div>
  </div>

  <div id="messaggio" class="mt-3"></div>

</div>

<script>
  const cfg = window.APP_CONFIG || {};
  const tabella = document.getElementById('tabella');
  const riepilogo = document.getElementById('riepilogo');
  const messaggio = document.getElementById('messaggio');
  const filtro = document.getElementById('filtro-rilevanti');
  const spinner = document.getElementById('spinner');

  document.getElementById('keyword-label').textContent = cfg.keyword || '-';

  function escapeHtml(testo) {
    return String(testo === undefined || testo === null ? '' : testo)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function badgeRilevante(valore) {
    return valore === 'SI'
      ? '<span class="badge text-bg-success">RILEVANTE</span>'
      : '<span class="badge text-bg-secondary">no</span>';
  }

  function labelsHtml(item) {
    const labels = item.labels || [];
    if (!labels.length) { return '<span class="text-secondary">nessun elemento</span>'; }
    return labels.map(l =>
      '<span class="badge text-bg-light border me-1 mb-1">' +
      escapeHtml(l.name) + ' <span class="text-secondary">' + Number(l.confidence).toFixed(1) + '%</span></span>'
    ).join('');
  }

  function anteprimaHtml(item) {
    if (!item.preview_url) { return '<span class="text-secondary small">n/d</span>'; }
    return '<a href="' + escapeHtml(item.preview_url) + '" target="_blank" rel="noopener">' +
      '<img src="' + escapeHtml(item.preview_url) + '" alt="anteprima" ' +
      'class="rounded border" style="width:100px;height:70px;object-fit:cover"></a>';
  }

  async function carica() {
    spinner.classList.remove('d-none');
    messaggio.innerHTML = '';
    const url = cfg.apiBaseUrl + '/images?limit=100' + (filtro.checked ? '&rilevanti=true' : '');

    try {
      const risposta = await fetch(url);
      const dati = await risposta.json();
      if (!risposta.ok) { throw new Error(dati.error || 'Errore nella lettura dei dati'); }

      const items = dati.items || [];
      if (!items.length) {
        tabella.innerHTML = '<tr><td colspan="5" class="text-center text-secondary py-4">' +
          'Nessuna immagine trovata. <a href="index.html">Carica la prima immagine</a>.</td></tr>';
      } else {
        tabella.innerHTML = items.map(item =>
          '<tr>' +
          '<td>' + anteprimaHtml(item) + '</td>' +
          '<td><code>' + escapeHtml(item.image_key) + '</code></td>' +
          '<td class="small">' + escapeHtml(item.upload_timestamp) + '</td>' +
          '<td>' + badgeRilevante(item.immagine_rilevante) + '</td>' +
          '<td>' + labelsHtml(item) + '</td>' +
          '</tr>'
        ).join('');
      }

      riepilogo.textContent = items.length + ' immagini' +
        (dati.solo_rilevanti ? ' rilevanti (keyword: ' + dati.keyword + ')' : ' totali') +
        ' - aggiornato alle ' + new Date().toLocaleTimeString('it-IT');
    } catch (errore) {
      tabella.innerHTML = '<tr><td colspan="5" class="text-center text-danger py-4">Errore di caricamento</td></tr>';
      messaggio.innerHTML = '<div class="alert alert-danger mb-0">Errore: ' + escapeHtml(errore.message) + '</div>';
    } finally {
      spinner.classList.add('d-none');
    }
  }

  document.getElementById('btn-ricarica').addEventListener('click', carica);
  filtro.addEventListener('change', carica);
  carica();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
